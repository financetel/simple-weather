name: Deploy weather function to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function and update secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and OPENWEATHER_API_KEY secrets and SUPABASE_PROJECT_REF variable first."
            exit 1
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" \
            "ALLOWED_ORIGINS=https://financetel.github.io"
          supabase functions deploy weather --project-ref "$SUPABASE_PROJECT_REF"
